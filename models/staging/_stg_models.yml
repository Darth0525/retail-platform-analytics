version: 2

# _stg_models.yml
# ---------------
# Documents all staging models with column descriptions and data quality tests.
#
# Built-in dbt tests used:
#   unique            — no duplicate values in a column (applied to primary keys)
#   not_null          — no null values (applied to required columns)
#   accepted_values   — column only contains values from a defined list
#   relationships     — every value exists in the referenced model (referential integrity)
#
# Note on composite primary keys (stg_order_items, stg_order_payments):
#   dbt's built-in unique test works on single columns only. Composite PK
#   uniqueness is verified via custom singular tests in tests/singular/.

models:

  # ---------------------------------------------------------------------------
  - name: stg_orders
    description: >
      Cleaned and renamed orders table. One row per order. Central table of
      the dataset — all other staging models join back to this via order_id.
    columns:
      - name: order_id
        description: Primary key. Unique identifier for each order.
        tests:
          - unique
          - not_null

      - name: customer_id
        description: >
          Foreign key to stg_customers. One-to-one with orders — each order
          has its own customer_id. Use customer_unique_id in stg_customers
          for true customer identity across orders.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: status
        description: Current lifecycle status of the order.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable',
                         'invoiced', 'processing', 'created', 'approved']

      - name: purchased_at
        description: Timestamp when the customer placed the order. Never null.
        tests:
          - not_null

      - name: approved_at
        description: Timestamp when payment was approved. Can be null for orders canceled before approval.

      - name: delivered_to_carrier_at
        description: Timestamp when the order was handed to the logistics carrier. Can be null for unshipped orders.

      - name: delivered_to_customer_at
        description: Timestamp when the customer received the order. Can be null for undelivered orders.

      - name: estimated_delivery_date
        description: Estimated delivery date shown to the customer at purchase time. Always set.
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  - name: stg_customers
    description: >
      Cleaned and renamed customers table. One row per order — NOT one row
      per real customer. customer_unique_id is the true customer identifier.
    columns:
      - name: customer_id
        description: Primary key. Unique per order, not per real customer. Joins to stg_orders.customer_id.
        tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: True unique identifier per real customer across all orders. Use for customer-level analysis.
        tests:
          - not_null

      - name: zip_code_prefix
        description: >
          First 5 digits of the customer zip code for this specific order.
          Can vary across orders for the same customer_unique_id — 250 customers
          (0.26%) have different zip codes across their orders, indicating real
          address changes between purchases. dim_customers uses the zip from the
          most recent order as the customer's last known location.
        tests:
          - not_null

      - name: city
        description: >
          Customer city name for this order. Raw spelling — can have variations
          (e.g. 'sao paulo' vs 'São Paulo'). Use int_geolocation_by_zip for
          standardized city names in downstream analysis.
        tests:
          - not_null

      - name: state
        description: >
          Customer 2-letter Brazilian state code for this order (e.g. SP, RJ, MG).
          Generally consistent but use int_geolocation_by_zip for standardized values.
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  - name: stg_sellers
    description: >
      Cleaned and renamed sellers table. One row per seller registered
      on the Olist marketplace.
    columns:
      - name: seller_id
        description: Primary key. Unique identifier for each seller. Joins to stg_order_items.seller_id.
        tests:
          - unique
          - not_null

      - name: zip_code_prefix
        description: First 5 digits of the seller zip code. Joins to stg_geolocation.
        tests:
          - not_null

      - name: city
        description: Seller city name.
        tests:
          - not_null

      - name: state
        description: Seller 2-letter Brazilian state code.
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  - name: stg_products
    description: >
      Cleaned and renamed products table. One row per product. Source typos
      in LENGHT columns corrected to length. Some products have incomplete
      category and dimension data — those columns can be null.
    columns:
      - name: product_id
        description: Primary key. Unique identifier for each product.
        tests:
          - unique
          - not_null

      - name: category_name_portuguese
        description: >
          Product category in Portuguese. Can be null for products with
          incomplete data. Joins to stg_product_categories for English name.

      - name: product_name_length
        description: Number of characters in the product name. Can be null for products with incomplete data.

      - name: product_description_length
        description: Number of characters in the product description. Can be null for products with incomplete data.

      - name: photos_qty
        description: Number of product photos published. Can be null for products with incomplete data.

      - name: weight_g
        description: Product weight in grams. Can be null for products with incomplete data.

      - name: length_cm
        description: Product length in centimetres. Can be null for products with incomplete data.

      - name: height_cm
        description: Product height in centimetres. Can be null for products with incomplete data.

      - name: width_cm
        description: Product width in centimetres. Can be null for products with incomplete data.

  # ---------------------------------------------------------------------------
  - name: stg_product_categories
    description: >
      Lookup table translating Portuguese product category names to English.
      71 rows — one per category.
    columns:
      - name: category_name_portuguese
        description: Product category name in Portuguese. Primary key. Joins to stg_products.category_name_portuguese.
        tests:
          - unique
          - not_null

      - name: category_name
        description: Product category name translated to English. Use this as the display name in downstream models.
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  - name: stg_order_items
    description: >
      Cleaned and renamed order_items table. One row per item per order.
      An order can have multiple items from different sellers.
      Composite primary key: order_id + order_item_id.
    columns:
      - name: order_id
        description: Foreign key to stg_orders. Part of composite primary key.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: order_item_id
        description: Sequential item number within the order (1, 2, 3...). Part of composite primary key.
        tests:
          - not_null

      - name: product_id
        description: Foreign key to stg_products.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: seller_id
        description: Foreign key to stg_sellers.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

      - name: shipping_limit_at
        description: Deadline by which the seller must hand the item to the carrier.
        tests:
          - not_null

      - name: price
        description: Item price in BRL, excluding freight.
        tests:
          - not_null

      - name: freight_value
        description: Freight cost in BRL for this item. Split across items when an order has multiple items.
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  - name: stg_order_payments
    description: >
      Cleaned and renamed order_payments table. One row per payment method per order.
      An order can have multiple rows if payment was split across methods.
      Composite primary key: order_id + payment_sequential.
      Known issue: 1 order in stg_orders has no matching row in this table —
      its payment was never recorded by Olist's system despite being delivered.
      Validated by stg_assert_orders_have_payment_record.
    columns:
      - name: order_id
        description: Foreign key to stg_orders. Part of composite primary key.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: payment_sequential
        description: >
          Counter (1, 2, 3...) numbering each payment method used on an order. Part of composite primary key.
          Known issue: 80 orders in source data have incomplete sequences — their sequential = 1 row is
          missing entirely, meaning the first payment record was never captured by Olist. Some orders also
          have gaps mid-sequence (e.g. 1, 3, 4). Validated by stg_assert_order_payments_sequence_complete.
        tests:
          - not_null

      - name: payment_type
        description: >
          Payment method used. Known issue: 3 rows have value 'not_defined' — payment type was
          not recorded by Olist's system. Included in accepted_values to avoid test failures.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

      - name: payment_installments
        description: >
          Number of installments chosen for this payment. 1 = paid in full. Only meaningful
          for credit_card payments — all other types always have 1 installment. Max observed
          value is 24 (monthly installments). Known issue: 2 credit_card rows have value 0,
          which is invalid. Validated by stg_assert_order_payments_installments_positive.
        tests:
          - not_null

      - name: payment_value
        description: Value of this payment in BRL.
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  - name: stg_order_reviews
    description: >
      Cleaned and renamed order_reviews table. One row per review submitted
      after delivery. Most customers only provide a score — comment fields
      are commonly null.
    columns:
      - name: review_id
        description: >
          Identifier for each review. NOT a true primary key — source data contains
          789 review_ids that appear on more than one order (1,412 orders affected, 1.42%).
          Scores and timestamps are identical on duplicate rows, indicating a review ID
          generation bug in Olist's system. True primary key is the composite of
          review_id + order_id. Validated by stg_assert_order_reviews_unique_review_per_order.
          Deduplication handled in int_order_reviews.
        tests:
          - not_null

      - name: order_id
        description: Foreign key to stg_orders.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: score
        description: Customer satisfaction score.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]

      - name: comment_title
        description: Optional short title for the review. Commonly null.

      - name: comment_message
        description: Optional free-text review message. Commonly null.

      - name: created_at
        description: Timestamp when the review survey was sent to the customer.
        tests:
          - not_null

      - name: answered_at
        description: Timestamp when the customer submitted the review.
        tests:
          - not_null

  # ---------------------------------------------------------------------------
  - name: stg_geolocation
    description: >
      Cleaned and renamed geolocation table. Maps Brazilian zip code prefixes
      to coordinates. zip_code_prefix is NOT unique — one prefix can have
      multiple coordinate entries. Deduplication handled in intermediate layer.
    columns:
      - name: zip_code_prefix
        description: >
          5-digit zip code prefix. NOT unique — one prefix can have multiple
          coordinate rows. Do not apply unique test here.
        tests:
          - not_null

      - name: latitude
        description: Latitude coordinate for this zip code prefix.
        tests:
          - not_null

      - name: longitude
        description: Longitude coordinate for this zip code prefix.
        tests:
          - not_null

      - name: city
        description: City name for this zip code prefix.
        tests:
          - not_null

      - name: state
        description: 2-letter Brazilian state code.
        tests:
          - not_null
